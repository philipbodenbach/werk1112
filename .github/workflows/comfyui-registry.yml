name: ComfyUI Registry

on:
  push:
    paths:
      - "utils/comfyUI/**"
      - ".github/workflows/comfyui-registry.yml"
  pull_request:
    paths:
      - "utils/comfyUI/**"
      - ".github/workflows/comfyui-registry.yml"
  workflow_dispatch:
    inputs:
      changelog:
        description: Optional release notes for this Registry version
        required: false
        type: string

permissions:
  contents: read

env:
  COMFY_CLI_VERSION: "1.12.0"
  DO_NOT_TRACK: "1"

jobs:
  validate:
    name: Validate and pack node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: utils/comfyUI
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            utils/comfyUI/requirements.txt
            utils/comfyUI/pyproject.toml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "comfy-cli==${COMFY_CLI_VERSION}" pytest ruff av
          python -m pip install -r requirements.txt
          # ComfyUI provides Torch and PyAV at runtime. PyAV is installed above
          # from PyPI; install only the CPU Torch wheel for this standalone CI
          # environment so validation never changes a user's ComfyUI packages.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Disable Comfy CLI telemetry prompts
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Run node tests
        run: python -m pytest -q tests

      - name: Validate Registry metadata and source
        run: comfy node validate

      - name: Build Registry archive
        run: comfy node pack

      - name: Verify Registry archive contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("node.zip")
          required = {
              "__init__.py",
              "audio_utils.py",
              "client.py",
              "config.py",
              "image_utils.py",
              "nodes.py",
              "pyproject.toml",
              "requirements.txt",
              "routes.py",
              "video_utils.py",
              "web/js/werk_ui.js",
          }
          with ZipFile(archive) as package:
              names = set(package.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Registry archive is missing runtime files: {missing}")
          if any(name == "tests" or name.startswith("tests/") for name in names):
              raise SystemExit("Registry archive unexpectedly contains tests/")
          print(f"Verified {archive} with {len(names)} packaged files")
          PY

      - name: Upload validated Registry archive
        uses: actions/upload-artifact@v7
        with:
          name: werk1112-comfyui-node
          path: utils/comfyUI/node.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish node
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: utils/comfyUI
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: utils/comfyUI/pyproject.toml

      - name: Install publishing tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "comfy-cli==${COMFY_CLI_VERSION}" ruff

      - name: Disable Comfy CLI telemetry prompts
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Require Registry publishing token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "${REGISTRY_ACCESS_TOKEN}" ]; then
            echo "REGISTRY_ACCESS_TOKEN is not configured for this repository." >&2
            exit 1
          fi

      - name: Publish current pyproject version
        env:
          COMFY_NODE_CHANGELOG: ${{ inputs.changelog }}
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: comfy node publish --token "${REGISTRY_ACCESS_TOKEN}"
