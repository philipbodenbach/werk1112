name: Release automation tests
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-checks.yml"
      - "scripts/prepare-release.py"
      - "scripts/wait-release-checks.py"
      - "scripts/tests/test*release*.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -p 'test*release*.py'
