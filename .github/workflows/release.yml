name: Release
run-name: Release prepared version${{ inputs.draft && ' — draft' || '' }}

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Keep release as a draft until manual artifacts are uploaded
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: werk-product-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow on the default branch: $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check out the requested commit and all release tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test release preparation
        run: python -m unittest discover -s scripts/tests -p 'test_prepare_release.py'

      - name: Validate prepared version and extract release notes
        id: prepare
        run: python scripts/prepare-release.py check --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Tag the reviewed release commit
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --exit-code
          git tag -a "$RELEASE_TAG" -m "Werk1112 $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=(--verify-tag --title "Werk1112 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
          {
            echo "### Werk1112 $RELEASE_TAG"
            echo
            echo "Release created (draft: $DRAFT). Build from tag \`$RELEASE_TAG\`."
            echo "Upload platform archives and their .sha256 files manually."
            echo "See docs/development/packaging-releases.md for the release checklist."
          } >> "$GITHUB_STEP_SUMMARY"
