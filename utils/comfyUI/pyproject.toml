[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-werk1112"
version = "0.1.0"
description = "Native Werk1112 inference nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "Pillow",
  "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

