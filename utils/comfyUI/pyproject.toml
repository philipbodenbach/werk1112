[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "werk1112"
version = "1.5.1"
description = "Beta Werk1112 inference and runtime-control nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Elastic-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
  "Pillow",
  "numpy",
]

[project.urls]
Repository = "https://github.com/philipbodenbach/werk1112"
Documentation = "https://philipbodenbach.github.io/werk1112/integrations/comfyui.html"
"Issue Tracker" = "https://github.com/philipbodenbach/werk1112/issues"

[tool.comfy]
PublisherId = "philipbodenbach"
DisplayName = "WERK1112 (Beta)"

[tool.pytest.ini_options]
testpaths = ["tests"]
