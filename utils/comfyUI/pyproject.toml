[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "werk1112"
version = "0.1.0"
description = "Beta Werk1112 inference nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
]
dependencies = [
  "Pillow",
  "numpy",
]

[project.urls]
Repository = "https://github.com/philipbodenbach/werk1112"
Documentation = "https://github.com/philipbodenbach/werk1112/tree/main/utils/comfyUI"
"Issue Tracker" = "https://github.com/philipbodenbach/werk1112/issues"

[tool.comfy]
PublisherId = "philipbodenbach"
DisplayName = "WERK1112 (Beta)"

[tool.pytest.ini_options]
testpaths = ["tests"]
