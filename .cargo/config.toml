[alias]
test-observability = "test --locked --lib observability"
build-cpu = "build --release --locked --no-default-features"
build-windows = "--config env.CL='/Zc:preprocessor' --config env.NVCC_PREPEND_FLAGS='-DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING' build --release --locked --no-default-features --target x86_64-pc-windows-msvc --features release-windows"
# Keep the CUDA release compiler defaults out of ordinary Linux builds and tests.
build-linux = "--config env.CC_x86_64_unknown_linux_gnu.value='gcc-10' --config env.CXX_x86_64_unknown_linux_gnu.value='g++-10' build --release --locked --no-default-features --target x86_64-unknown-linux-gnu --features release-linux"
build-linux-aarch64 = "--config env.CUDA_COMPUTE_CAP.value='121' --config env.CUDA_COMPUTE_CAP.force=true build --release --locked --no-default-features --target aarch64-unknown-linux-gnu --features release-linux-aarch64"
build-linux-strix-halo = "build --release --locked --no-default-features --target x86_64-unknown-linux-gnu --features release-linux-strix-halo"
build-macos-apple-silicon = "build --release --locked --no-default-features --target aarch64-apple-darwin --features release-macos-apple-silicon"

[env]
CUDA_COMPUTE_CAP = { value = "86", force = false }
